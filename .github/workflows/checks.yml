name: Checks

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  lint:
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install lint tools
        run: brew install ansible yamllint shellcheck

      - name: Run checks
        run: make lint
