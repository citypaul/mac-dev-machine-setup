- name: Configure dock
  block:
    - name: Install dockutil
      community.general.homebrew:
        name: dockutil
        state: latest
        install_options: force
      ignore_errors: true
      tags:
        - install
        - dock

    - name: Clear dock
      shell: dockutil --remove all --no-restart
      tags:
        - install
        - dock

    # "already exists in dock" means the app is pinned already, so it isn't a
    # failure. dockutil's --replacing can't be used to avoid it: it only matches
    # the dock label, not the app's path or bundle id.
    - name: Setup dock
      shell: dockutil --add {{ item }} --no-restart
      register: dock_add
      failed_when: dock_add.rc != 0 and 'already exists in dock' not in dock_add.stdout
      with_items:
        - /Applications/Slack.app
        - /Applications/Spotify.app
        - /Applications/Fantastical.app
        - "'' --type small-spacer --section apps --after Fantastical"
        - /Applications/Alacritty.app
        - /Applications/Ghostty.app
        - /Applications/Cursor.app
        - /Applications/Audio\ Hijack.app
        - /Applications/Loopback.app
        - /Applications/Brave\ Browser.app
        - /Applications/Google\ Chrome.app
        - /Applications/Firefox.app
        - /Applications/ResponsivelyApp.app
        - /Applications/Deskpad.app
        - "'' --type small-spacer --section apps --after Deskpad"
        - /Applications/Bruno.app
        - /Applications/TablePlus.app
        - /Applications/Sourcetree.app
        - /Applications/Raycast.app
        - /Applications/ChatGPT.app
        - /Applications/Claude.app
        - /Applications/FluidVoice.app
        - /Applications/Talat.app

      ignore_errors: true
      tags:
        - install
        - dock
        - work
        - personal

    - name: Add dock items specific to personal machine
      shell: dockutil --add {{ item }} --no-restart
      register: dock_add_personal
      failed_when: dock_add_personal.rc != 0 and 'already exists in dock' not in dock_add_personal.stdout
      with_items:
        # After the last shared item, so personal items sit in their own group.
        - "'' --type small-spacer --section apps --after Talat"
        - /Applications/Obsidian.app
      ignore_errors: true
      tags:
        - install
        - dock
        - personal

    - name: Restart dock
      shell: "/usr/bin/killall Dock"
      tags:
        - install
        - dock
        - personal
