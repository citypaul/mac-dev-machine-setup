# Homebrew 6.0+ refuses to load casks from untrusted third-party taps
# (steipete/tap) when its tap-trust gate is active, which aborts the
# bundle below. Trust the taps first. See brew-trust-taps.yaml for
# full context.
- name: Trust third-party Homebrew taps before gui package installs
  ansible.builtin.import_tasks: brew-trust-taps.yaml
  tags:
    - install
    - productivity
    - gui

# The Brewfiles are the source of truth. An app deleted outside Homebrew
# leaves brew's install record behind, and `brew bundle` trusts the record
# and skips the cask. Clear those records first so the bundle reinstalls the
# app. See scripts/clear-stale-cask-receipts.py.
- name: Clear stale records for GUI casks whose files have gone missing
  ansible.builtin.command: >-
    "{{ playbook_dir }}/scripts/clear-stale-cask-receipts.py"
    "{{ playbook_dir }}/Brewfile.gui"
  environment: "{{ homebrew_environment }}"
  register: clear_stale_gui
  changed_when: "'CLEARED:' in clear_stale_gui.stdout"
  ignore_errors: true
  tags:
    - install
    - gui
    - productivity

# --force overwrites an app that already exists but Homebrew did not install.
# Without it, bundle only adopts an app whose version matches the cask.
- name: Install GUI packages from Brewfile
  ansible.builtin.command: brew bundle --force --file "{{ playbook_dir }}/Brewfile.gui"
  environment: "{{ homebrew_environment }}"
  register: brew_bundle_gui
  changed_when: >-
    'Installing' in brew_bundle_gui.stdout or
    'Upgrading' in brew_bundle_gui.stdout or
    'Tapping' in brew_bundle_gui.stdout
  # Retry once: brew's post-install auto-cleanup can hit a transient
  # filesystem race that exits non-zero despite a successful install.
  until: brew_bundle_gui.rc == 0
  retries: 1
  delay: 5
  ignore_errors: true
  tags:
    - install
    - gui
    - productivity

- name: Install Talat
  ansible.builtin.import_tasks: talat.yaml
  vars:
    talat_app_path: /Applications/Talat.app
  tags:
    - install
    - gui
    - productivity

- name: Clear stale records for personal casks whose files have gone missing
  ansible.builtin.command: >-
    "{{ playbook_dir }}/scripts/clear-stale-cask-receipts.py"
    "{{ playbook_dir }}/Brewfile.personal"
  environment: "{{ homebrew_environment }}"
  register: clear_stale_personal
  changed_when: "'CLEARED:' in clear_stale_personal.stdout"
  ignore_errors: true
  tags:
    - personal

- name: Install personal GUI packages from Brewfile
  ansible.builtin.command: brew bundle --force --file "{{ playbook_dir }}/Brewfile.personal"
  environment: "{{ homebrew_environment }}"
  register: brew_bundle_personal
  changed_when: >-
    'Installing' in brew_bundle_personal.stdout or
    'Upgrading' in brew_bundle_personal.stdout or
    'Tapping' in brew_bundle_personal.stdout
  # Retry once: brew's post-install auto-cleanup can hit a transient
  # filesystem race that exits non-zero despite a successful install.
  until: brew_bundle_personal.rc == 0
  retries: 1
  delay: 5
  ignore_errors: true
  tags:
    - personal
