---
- name: Update all installed packages
  tags:
    - update
  block:
    - name: Check the update profile
      ansible.builtin.assert:
        that: update_profile in ['personal', 'work']
        fail_msg: "update_profile must be personal or work, not '{{ update_profile }}'"
        quiet: true

    - name: Update Homebrew
      community.general.homebrew:
        update_homebrew: yes
      environment: "{{ homebrew_environment }}"
      register: brew_update

    # Updating Homebrew can flip on its tap-trust gate, after which
    # `brew upgrade` refuses to load outdated formulae from third-party
    # taps. Trust the taps first. See brew-trust-taps.yaml for context.
    - name: Trust third-party Homebrew taps before upgrading
      ansible.builtin.import_tasks: brew-trust-taps.yaml

    # The Brewfiles are the source of truth, so an update also installs
    # anything missing (including apps deleted outside Homebrew) and removes
    # everything on the removal lists, before upgrading what is left.
    - name: Clear stale records for casks whose files have gone missing
      ansible.builtin.command: >-
        "{{ playbook_dir }}/scripts/clear-stale-cask-receipts.py"
        "{{ playbook_dir }}/Brewfile.gui"
        "{{ playbook_dir }}/Brewfile.fonts"
        "{{ playbook_dir }}/Brewfile.{{ update_profile }}"
      environment: "{{ homebrew_environment }}"
      register: clear_stale
      changed_when: "'CLEARED:' in clear_stale.stdout"
      ignore_errors: true

    - name: Install anything missing from the Brewfiles
      ansible.builtin.command: brew bundle install --force --no-upgrade --file "{{ playbook_dir }}/{{ item }}"
      environment: "{{ homebrew_environment }}"
      loop:
        - Brewfile.cli
        - Brewfile.gui
        - Brewfile.fonts
        - Brewfile.app-store
        - "Brewfile.{{ update_profile }}"
      register: brew_bundle_missing
      changed_when: >-
        'Installing' in brew_bundle_missing.stdout or
        'Tapping' in brew_bundle_missing.stdout
      ignore_errors: true

    - name: Install Talat if it is missing
      ansible.builtin.import_tasks: talat.yaml
      vars:
        talat_app_path: /Applications/Talat.app

    - name: Remove packages on the removal lists
      ansible.builtin.import_tasks: remove-unwanted-packages.yaml

    - name: Remove work-only packages
      ansible.builtin.import_tasks: remove-work-packages.yaml
      when: update_profile == 'work'

    - name: Upgrade all Homebrew packages
      community.general.homebrew:
        upgrade_all: yes
      environment: "{{ homebrew_environment }}"
      register: brew_upgrade

    # greedy also upgrades casks that update themselves, which a plain
    # `brew upgrade --cask` skips.
    - name: Upgrade all Homebrew casks
      community.general.homebrew_cask:
        upgrade_all: yes
        greedy: true
      environment: "{{ homebrew_environment }}"
      register: cask_upgrade
      ignore_errors: yes  # Some casks may fail if app is running

    # `brew upgrade` above will have re-linked the unversioned `node`
    # formula (pulled in as a dep of agent-browser, gemini-cli, opencode)
    # to whatever current major release brew ships. That silently flips
    # `/opt/homebrew/bin/node` to Node 25.x, overriding nvm's LTS.
    # Re-unlink so nvm keeps control. See brew-unlink-node.yaml.
    - name: Unlink Homebrew node after brew upgrade
      ansible.builtin.import_tasks: brew-unlink-node.yaml

    - name: Clean up Homebrew
      command: brew cleanup -s
      changed_when: true

    - name: Update npm packages globally
      shell: |
        if command -v npm &> /dev/null; then
          npm update -g
        fi
      register: npm_update
      changed_when: npm_update.rc == 0
      ignore_errors: yes

    - name: Update pnpm packages globally
      shell: |
        export PNPM_HOME="{{ ansible_env.HOME }}/Library/pnpm"
        export PATH="$PNPM_HOME/bin:$PNPM_HOME:$PATH"
        if command -v pnpm &> /dev/null; then
          pnpm update -g
        fi
      register: pnpm_update
      changed_when: pnpm_update.rc == 0
      ignore_errors: yes

    - name: Update Mac App Store apps
      command: mas upgrade
      register: mas_update
      changed_when: "'No updates available' not in mas_update.stdout"
      ignore_errors: yes

    - name: Update Rust toolchain
      shell: |
        if command -v rustup &> /dev/null; then
          rustup update
        fi
      register: rust_update
      changed_when: rust_update.rc == 0
      ignore_errors: yes

    - name: Update Go packages
      shell: |
        if command -v go &> /dev/null; then
          go install -v $(go list -m -u all 2>/dev/null | grep -v "^go " | awk '{print $1"@latest"}') 2>/dev/null || true
        fi
      register: go_update
      changed_when: go_update.rc == 0
      ignore_errors: yes

    - name: Update tmux plugins
      shell: |
        if [ -d "$HOME/.tmux/plugins/tpm" ]; then
          $HOME/.tmux/plugins/tpm/bin/update_plugins all
        fi
      register: tmux_update
      changed_when: tmux_update.rc == 0
      ignore_errors: yes

    - name: Update Ollama models
      shell: |
        if command -v ollama &> /dev/null; then
          for model in $(ollama list | tail -n +2 | awk '{print $1}'); do
            echo "Updating $model..."
            ollama pull "$model"
          done
        fi
      register: ollama_update
      changed_when: ollama_update.rc == 0
      ignore_errors: yes

    - name: Display update summary
      debug:
        msg:
          - "Update Summary:"
          - "Homebrew: {{ 'Updated' if brew_update.changed else 'No updates' }}"
          - "Homebrew packages: {{ 'Upgraded' if brew_upgrade.changed else 'No upgrades' }}"
          - "Homebrew casks: {{ 'Upgraded' if cask_upgrade.changed else 'No upgrades' }}"
          - "NPM packages: {{ 'Updated' if npm_update.changed else 'Skipped/No updates' }}"
          - "Mac App Store: {{ 'Updated' if mas_update.changed else 'No updates' }}"
          - "Rust: {{ 'Updated' if rust_update.changed else 'Skipped/No updates' }}"
          - "Go packages: {{ 'Updated' if go_update.changed else 'Skipped/No updates' }}"
