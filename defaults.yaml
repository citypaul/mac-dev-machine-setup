git_email: paul.hammond@gmail.com
git_name: Paul Hammond

dotfiles_repo: https://github.com/citypaul/.dotfiles.git

dotfiles_stow_packages:
  - zsh
  - tmux
  - gnupg
  - alacritty
  - zellij
  - .oh-my-zsh
  - ghostty
  - herdr

claude_installer_agents:
  - codex
claude_installer_with_opencode: true

# Coding agents that report their state to the Herdr sidebar via a hook.
# `herdr integration install --help` lists every supported target.
herdr_integrations:
  - claude
  - codex

# Agents that get the herdr skill, which lets an agent drive the workspace it
# is running inside. Uses skills.sh agent names, not the integration names above.
herdr_skill_agents:
  - claude-code
  - codex

cli_packages_to_remove_if_installed:
  - neofetch

gui_packages_to_remove_if_installed:
  - adguard
  - arc
  - bartender
  - devtoys
  - exa
  - granola
  - handy
  - hiddenbar
  - ngrok
  - orbstack
  - pgadmin4
  - rewind
  - snagit
  - spokenly
  - unclack
  - utm
  - visual-studio-code@insiders
  - wezterm
  - whisky
  - zotero

# Uninstalled with --zap, which also deletes the app's settings, caches and
# support files. Only list apps whose data shouldn't survive removal.
gui_packages_to_zap_if_installed:
  - karabiner-elements

# Mac App Store apps, by id (`mas list` shows ids).
app_store_apps_to_remove_if_installed:
  - 457622435 # Yoink

gui_packages_to_remove_if_installed_work:
  - brave-browser
  - protonvpn

pnpm_global_packages:
  - "@earendil-works/pi-coding-agent"
  - task-master-ai
